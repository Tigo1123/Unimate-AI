services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: unimate
      POSTGRES_PASSWORD: unimate
      POSTGRES_DB: unimate
    ports:
      - '5432:5432'
    volumes:
      - unimate_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unimate']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  unimate_postgres:
